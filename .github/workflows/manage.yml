name: manage

# Add or remove a watched product from a phone: Run workflow, pick add or remove,
# paste an ASIN or an Amazon link. After committing, this dispatches the poll
# workflow so the change shows on the status page about a minute later. The
# dispatch is explicit because GitHub does not raise push events for commits made
# with GITHUB_TOKEN, so committing products.json alone would start nothing.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Add or remove"
        type: choice
        options: [add, remove]
        required: true
        default: add
      product:
        description: "ASIN or Amazon product URL"
        required: true
      label:
        description: "Name to show on the page and in notifications (optional)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # to dispatch the poll workflow once the change is committed

concurrency:
  group: manage

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply the change
        env:
          ACTION: ${{ inputs.action }}
          PRODUCT: ${{ inputs.product }}
          LABEL: ${{ inputs.label }}
        run: python -m watch.manage --action "$ACTION" --product "$PRODUCT" --label "$LABEL"

      - name: Commit and push
        id: commit
        env:
          ACTION: ${{ inputs.action }}
          PRODUCT: ${{ inputs.product }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "products.json unchanged"
          else
            git commit -q -m "chore: $ACTION product $PRODUCT"
            # The poll pushes to main every hour, so a collision is possible.
            # Rebase onto whatever landed and try once more before failing.
            git push -q origin HEAD:main || {
              git pull -q --rebase origin main
              git push -q origin HEAD:main
            }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll now
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # workflow_dispatch is the one event GITHUB_TOKEN may raise, so this is how
        # the new product gets checked without waiting for the next hourly poll.
        run: gh workflow run poll.yml --ref main
