name: poll

# One short job per run: read the status page's command mailbox, poll Amazon,
# commit the result. Runs hourly. (It used to be a ~6h loop ticking every
# minute, which kept a runner busy 24/7 and burned the Actions minutes.) The
# page's Add button now takes effect at the next run instead of within a minute;
# the manage workflow still dispatches a run right away.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watch/**"
      - "requirements.txt"
      - ".github/workflows/poll.yml"
      # Only helps when a human edits the list and pushes: the manage workflow's
      # own commit raises no push event, so it dispatches this workflow instead.
      - "products.json"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          CMD_PASSPHRASE: ${{ secrets.CMD_PASSPHRASE }}
        run: |
          # Cron start times jitter, so a run can begin a few minutes under an
          # hour after the last one and the tick would skip its poll. Forget the
          # last poll time so every run polls.
          python - <<'EOF'
          import json, os
          if os.path.exists("state.json"):
              s = json.load(open("state.json"))
              s.pop("last_checked", None)
              json.dump(s, open("state.json", "w"), indent=2)
          EOF
          rc=0
          python -m watch.tick || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || [ "$rc" -eq 4 ] || echo "tick exited $rc"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- state.json history.json products.json docs/index.html || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -q -m "chore: watch $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push -q origin HEAD:main || {
            git pull -q --rebase -X theirs origin main
            git push -q origin HEAD:main
          }
