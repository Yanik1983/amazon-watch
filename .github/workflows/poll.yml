name: poll

# One long-running job ticks every minute for ~5h50m. A tick reads the status
# page's command mailbox; it polls Amazon only once an hour, which is what makes
# the page's Add button respond in about a minute without asking Amazon more
# often. A new job starts every 3 hours (or on a code push) and cancels the
# previous one, so the watcher is running continuously even when GitHub delays
# scheduled runs. A job also replaces itself early when Amazon has been
# captcha-blocking its runner for two polls, since a new job gets a new address.
on:
  schedule:
    - cron: "13 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watch/**"
      - "requirements.txt"
      - ".github/workflows/poll.yml"
      # Only helps when a human edits the list and pushes: the manage workflow's
      # own commit raises no push event, so it dispatches this workflow instead.
      - "products.json"

permissions:
  contents: write
  actions: write   # to start a replacement job when Amazon blocks this runner

concurrency:
  group: poll
  cancel-in-progress: true

env:
  LOOP_MINUTES: 350
  INTERVAL_SECONDS: 3600   # how often Amazon is asked
  TICK_SECONDS: 60         # how often the command mailbox is read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch loop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          CMD_PASSPHRASE: ${{ secrets.CMD_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$((n + 1))
            # Start every tick from the current main. Everything this loop writes
            # is regenerated from scratch, so nothing local is worth keeping, and
            # syncing first is what makes the committed product list authoritative:
            # acting on a stale checkout would watch a product just removed.
            if git fetch -q origin main; then
              git reset -q --hard origin/main
            else
              echo "tick $n: fetch failed; working from the checkout as it stands"
            fi
            # Reads the command mailbox; polls Amazon only when the hour is up.
            # Exit 3 means every product has been failing for a while, which is
            # almost always Amazon captcha-blocking this runner's address.
            # Exit 4 means the status page's "Cancel poll" button was pressed.
            rc=0
            python -m watch.tick || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || [ "$rc" -eq 4 ] || echo "tick $n exited $rc"
            git add --all -- state.json history.json products.json docs/index.html || true
            if git diff --cached --quiet; then
              :
            else
              echo "tick #$n $(date -u +'%Y-%m-%d %H:%M UTC'): committing"
              git commit -q -m "chore: watch $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
              # A rejected push needs no repair: the next tick resets to main and
              # acts again, and an unsent alert is re-detected from that state.
              git push -q origin HEAD:main || echo "push rejected; the next tick retries"
            fi
            if [ "$rc" -eq 4 ]; then
              echo "tick $n: stopped from the status page; the schedule starts the next job"
              break
            fi
            if [ "$rc" -eq 3 ]; then
              # A replacement job runs on a different machine with a different
              # address. Its start cancels this job through the concurrency
              # group, so the loop ends here either way. The tick only asks for
              # this after a poll, so restarts are at most one per retry interval.
              echo "tick $n: Amazon keeps blocking this runner; starting a replacement job"
              if gh workflow run poll.yml --ref main; then
                break
              fi
              echo "dispatch failed; carrying on here until the next scheduled job"
            fi
            remaining=$(( end - $(date +%s) ))
            [ "$remaining" -le "$TICK_SECONDS" ] && break
            sleep "$TICK_SECONDS"
          done
          echo "loop finished after $n tick(s)"
